---
name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "New package version"
        type: string
        required: true

jobs:
  build-macos:
    strategy:
      matrix:
        arch: [x86_64, arm64]
    runs-on: macos-latest
    env:
      triple_name: ${{ matrix.arch }}-apple-macosx
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: beeauvin/swiftly-swift@49abcbec4fd5b0c47183d4373a5f1dbc96bc96a0 # v1.0
        with:
          swift-version: "6.2"

      - name: Cache Swift toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.swiftly
          key: swift-6.2-${{ runner.os }}-${{ runner.arch }}

      - name: Build for ${{ matrix.arch }}
        run: swift build --configuration release --swift-sdk "${{ env.triple_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ env.triple_name }}
          if-no-files-found: error
          path: .build/${{ env.triple_name }}/release/tm_isdst

  build-linux:
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    container:
      image: "docker.io/library/swift:6.2.0-noble@sha256:471acf16d3ce9b270d2f15ea177b0e150bdf1595ae2acfcc4932d1a03f43c3fd"
    env:
      triple_name: ${{ matrix.arch }}-swift-linux-musl
      artifact_name: ${{ matrix.arch }}-linux-musl
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      # Note: the Swift SDK version must match the Swift toolchain version exactly – toolchain 6.2.1 is *not* compatible with SDK 6.2.0
      - name: "Install Swift 6.2 SDK"
        run: "swift sdk install https://download.swift.org/swift-6.2-release/static-sdk/swift-6.2-RELEASE/swift-6.2-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz --checksum d2225840e592389ca517bbf71652f7003dbf45ac35d1e57d98b9250368769378"

      - name: Build for ${{ matrix.arch }}
        run: swift build --configuration release --swift-sdk "${{ env.triple_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ env.artifact_name }}
          if-no-files-found: error
          path: .build/${{ env.triple_name }}/release/tm_isdst

  release:
    name: Create Github release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: ./artifacts

      - name: Create Github release with artifacts
        uses: "marvinpinto/action-automatic-releases@919008cf3f741b179569b7a6fb4d8860689ab7f0" # v1.2.1
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ inputs.package_version }}"
          prerelease: false
          draft: true
          title: "tm_isdst v${{ inputs.package_version }}"
          files: ./artifacts/*
